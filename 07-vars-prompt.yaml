- name: vars promt
  hosts: local
  connection: local
  vars_prompts:
  - name: username
    prompt: what is your username?
    private: false
  - name: password
    prompt: enter your passward
    private: true
  tasks: 
  - name: print user details
    ansible.builtin.debug:
      msg: "Hello, Username is: {{ username }}, Password is: {{ password }}"